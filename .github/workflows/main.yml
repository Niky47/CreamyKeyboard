name: Compila CreamyKeyboard APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extracted/CreamyKeyboard
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Estrai ZIP
        working-directory: ./
        run: |
          unzip repo/*.zip -d extracted

      - name: Imposta Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila Debug APK
        run: gradle assembleDebug

      - name: Carica APK generato
        uses: actions/upload-artifact@v4
        with:
          name: CreamyKeyboard-debug
          path: extracted/CreamyKeyboard/app/build/outputs/apk/debug/*.apk
